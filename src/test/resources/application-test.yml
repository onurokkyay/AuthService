spring:
  jpa:
    hibernate:
      # Flyway still owns the schema; validation proves migrations and entities agree.
      ddl-auto: validate

auth:
  jwt:
    issuer: https://auth.test
    audience: test-clients
    access-token-ttl: 15m
    # No keys configured: the test profile is one of the two where an ephemeral pair
    # is allowed, which also exercises that code path.
  refresh-token:
    ttl: 30d
    cleanup-cron: "0 0 3 * * *"
  login:
    max-failed-attempts: 3
    lock-duration: 15m
  registration:
    bootstrap-admin-emails: admin@example.test
  cors:
    allowed-origins: https://client.test
    allowed-methods: GET,POST,PATCH,OPTIONS
  password-reset:
    token-ttl: 30m
    request-cooldown: 60s
    link-template: https://client.test/reset-password?token={token}
    cleanup-cron: "0 45 3 * * *"
    mail:
      # The integration test replaces the mailer and reads the link it was given.
      enabled: false
      from: no-reply@example.test
      product-name: Test
      subject: Reset your {product} password
      body-template: "Open {link}"

logging:
  level:
    com.krawenn.auth: DEBUG
