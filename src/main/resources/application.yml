spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/authservice}
    username: ${DB_USERNAME:auth}
    password: ${DB_PASSWORD:auth}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway; Hibernate only checks that it agrees.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

  threads:
    virtual:
      enabled: true

  # spring.mail.* is intentionally absent. Spring Boot creates a mail sender only when
  # spring.mail.host is set, and declaring it here with an empty default would count as set --
  # producing a sender pointed at nothing. Configure it from the environment instead
  # (SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD).

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

auth:
  jwt:
    # Both are also verified on incoming tokens, so consumers must be issued tokens by
    # this exact issuer/audience pair.
    issuer: ${AUTH_JWT_ISSUER:http://localhost:8081}
    audience: ${AUTH_JWT_AUDIENCE:auth-service-clients}
    access-token-ttl: ${AUTH_JWT_ACCESSTOKENTTL:15m}
    # auth.jwt.private-key / auth.jwt.public-key are intentionally absent here.
    # Set them to a PEM resource (for example file:/etc/auth/private.pem) in the
    # deployment configuration. When unset, a throwaway key pair is generated at
    # startup — convenient locally, refused in production by KeyPairFactory.

  refresh-token:
    ttl: ${AUTH_REFRESHTOKEN_TTL:30d}
    cleanup-cron: ${AUTH_REFRESHTOKEN_CLEANUPCRON:0 15 3 * * *}

  login:
    max-failed-attempts: ${AUTH_LOGIN_MAXFAILEDATTEMPTS:5}
    lock-duration: ${AUTH_LOGIN_LOCKDURATION:15m}

  registration:
    # Accounts registering with one of these emails are created as ADMIN.
    bootstrap-admin-emails: ${AUTH_REGISTRATION_BOOTSTRAPADMINEMAILS:}

  cors:
    # Empty by default: a browser client has to be named explicitly.
    allowed-origins: ${AUTH_CORS_ALLOWEDORIGINS:}
    allowed-methods: GET,POST,PATCH,OPTIONS

  password-reset:
    # How long an emailed link works. Short, because the link is a credential for as long as
    # it lives.
    token-ttl: ${AUTH_PASSWORDRESET_TOKENTTL:30m}
    # How long an account waits before another link is sent. What keeps the endpoint from
    # being used to fill somebody's inbox.
    request-cooldown: ${AUTH_PASSWORDRESET_REQUESTCOOLDOWN:60s}
    # Where the emailed link points: a page of the consuming application, which posts the
    # token back to /api/auth/password/reset. {token} is replaced with the token.
    link-template: ${AUTH_PASSWORDRESET_LINKTEMPLATE:http://localhost:3000/reset-password?token={token}}
    cleanup-cron: ${AUTH_PASSWORDRESET_CLEANUPCRON:0 45 3 * * *}
    mail:
      # Off by default, so a deployment without a mail server still starts. Turning it on
      # also needs spring.mail.host (SPRING_MAIL_HOST).
      enabled: ${AUTH_PASSWORDRESET_MAIL_ENABLED:false}
      from: ${AUTH_PASSWORDRESET_MAIL_FROM:no-reply@localhost}
      product-name: ${AUTH_PASSWORDRESET_MAIL_PRODUCTNAME:Auth Service}
      subject: ${AUTH_PASSWORDRESET_MAIL_SUBJECT:Reset your {product} password}
      # A literal block rather than a ${...} default, because it spans lines. The environment
      # still overrides it: AUTH_PASSWORDRESET_MAIL_BODYTEMPLATE outranks this file.
      body-template: |
        Hello {username},

        Somebody asked to reset the password of your {product} account. If it was you,
        open this link within {minutes} minutes to choose a new one:

        {link}

        If it was not you, you can ignore this email. Your password has not changed.

logging:
  level:
    com.krawenn.auth: INFO
  pattern:
    # Carries the RequestIdFilter correlation id on every line.
    level: "%5p [${spring.application.name},%X{requestId:-}]"
