name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting (Spotless)
        run: ./gradlew spotlessCheck

      # The integration test starts PostgreSQL through Testcontainers, which the
      # ubuntu-latest runner provides.
      - name: Build, lint and test
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test

  domain-independence:
    name: No consumer-specific concepts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This service must stay reusable. Any concept belonging to a consuming
      # application leaking into the source is a build failure, not a review comment.
      - name: Scan sources
        run: |
          if grep -rniE 'gameatlas|playstation|steam|xbox|nintendo|trophy|achievement|wishlist|backlog' src/; then
            echo "::error::A consumer-specific concept leaked into the source tree."
            exit 1
          fi

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t auth-service:ci .
