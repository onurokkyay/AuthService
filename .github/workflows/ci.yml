name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting (Spotless)
        run: ./gradlew spotlessCheck

      # The integration test starts PostgreSQL through Testcontainers, which the
      # ubuntu-latest runner provides.
      - name: Build, lint and test
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test

  domain-independence:
    name: No consumer-specific concepts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This service must stay reusable. Any concept belonging to a consuming
      # application leaking into the source is a build failure, not a review comment.
      - name: Scan sources
        run: |
          if grep -rniE 'gameatlas|playstation|steam|xbox|nintendo|trophy|achievement|wishlist|backlog' src/; then
            echo "::error::A consumer-specific concept leaked into the source tree."
            exit 1
          fi

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    needs: build

    # The image is started, not only built. Building it proves nothing about whether it runs:
    # the entrypoint named a loader class the `tools` jarmode does not ship, which built green
    # and died with ClassNotFoundException the first time anyone started a container.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: authservice
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth -d authservice"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t auth-service:ci .

      - name: Start it and verify it signs
        run: |
          # The local profile generates a key pair at startup, which is what makes this
          # runnable without mounting one.
          docker run -d --name auth-ci --network host \
            -e DB_URL=jdbc:postgresql://localhost:5432/authservice \
            -e DB_USERNAME=auth \
            -e DB_PASSWORD=auth \
            -e SPRING_PROFILES_ACTIVE=local \
            auth-service:ci

          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8081/actuator/health > /dev/null 2>&1; then
              echo "Application answered on attempt $attempt"
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' auth-ci)" != "true" ]; then
              echo "Container exited before answering:"
              docker logs auth-ci
              exit 1
            fi
            sleep 2
            if [ "$attempt" = "60" ]; then
              echo "Application never answered:"
              docker logs auth-ci
              exit 1
            fi
          done

          # A health check only proves Spring started. JWKS proves the signing key loaded,
          # which is the part a container gets wrong, and it is also the exact document
          # every consuming service fetches to verify a token.
          curl -fsS http://localhost:8081/.well-known/jwks.json | grep -q '"kty"' \
            || { echo "JWKS did not contain a key"; docker logs auth-ci; exit 1; }
          echo "JWKS served a key"

          # Migrations ran against a database that started empty, so this also proves the
          # schema builds from scratch.
          docker logs auth-ci | grep -E "Started AuthApplication|Successfully applied"

      - name: Container logs on failure
        if: failure()
        run: docker logs auth-ci || true
